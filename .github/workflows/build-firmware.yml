name: Build a firmware

on:
  workflow_call:
    inputs:
      keyboard:
        type: string
        required: true
      keymap:
        type: string
        required: true

jobs:
  build:
    name: Build a firmware ${{ inputs.keyboard }}:${{ inputs.keymap }}

    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/qmk/qmk_cli:latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        ref: feature/emacs
        submodules: recursive
    - name: Set up QMK environment
      run: qmk setup --home . --yes
    - name: Install Python dependencies
      run: /usr/bin/python3 -m pip install -r requirements.txt
    # - name: PWD
    #   run: pwd
    # - name: list files
    #   run: ls -la ./keyboards/keychron/${{ inputs.keyboard }}/keymaps/${{ inputs.keymap }}
    - name: Compile and link
      run: qmk compile -j $(nproc) -kb keychron/${{ inputs.keyboard }} -km ${{ inputs.keymap }}
    - name: Archive built firmware
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.keyboard }}-${{ inputs.keymap }}-firmware
        path: __qmk__/*.hex
